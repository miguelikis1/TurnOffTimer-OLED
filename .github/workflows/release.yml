name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Fix line endings and permissions for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish Release with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          echo "Publicando release para tag: $TAG_NAME"
          
          # Crear release o actualizar existente y subir el APK
          gh release create "$TAG_NAME" app/build/outputs/apk/release/app-release.apk#SleepTimer-OLED-v1.0.0.apk \
            --title "Sleep Timer OLED $TAG_NAME" \
            --notes "Release de Sleep Timer OLED (APK nativo ~931 KB listo para instalar)." \
            --latest || \
          gh release upload "$TAG_NAME" app/build/outputs/apk/release/app-release.apk#SleepTimer-OLED-v1.0.0.apk --clobber
